services:
  app:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/gridpulse
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:?Set ADMIN_BOOTSTRAP_SECRET for one-time administrator setup}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - gridpulse-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo-test:
    image: mongo:7
    profiles: ["integration-test"]
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gridpulse-mongo:
